[package]
name = "openkey-core"
version = "0.1.0"
edition = "2021"
description = "Extensão Python (pyo3) expondo o núcleo Rust FIDO2 como VirtualAuthenticator"
license = "MIT"

[lib]
name = "openkey_core"
crate-type = ["cdylib"]

# Crate fora do workspace principal: `maturin` é o único build system usado aqui.
# O mesmo núcleo (`firmware/authenticator`) compila para o firmware embarcado.
[workspace]

[dependencies]
authenticator = { path = "../../firmware/authenticator" }
board-generic = { path = "../../firmware/board-generic" }
ctap2 = { path = "../../protocol/ctap2" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
