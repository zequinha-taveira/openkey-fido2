[package]
name = "ctap2"
version = "0.1.1"
edition = "2021"
description = "CTAP2 protocol implementation for FIDO2 authenticators"
license = "MIT"
build = "build.rs"

[dependencies]
crypto = { path = "../../protocol/crypto" }
storage = { path = "../../firmware/storage" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
ring = "0.17"
zeroize = { workspace = true }
