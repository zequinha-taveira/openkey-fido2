[package]
name = "device-profile"
version = "0.1.1"
edition = "2021"
description = "Device profile and capability discovery for FIDO2 authenticators"
license = "MIT"

[dependencies]
board-generic = { path = "../board-generic" }
ctap2 = { path = "../../protocol/ctap2", default-features = false }
log = "0.4"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[features]
default = ["rs256", "std"]
# Propaga o suporte a RS256 da crate `crypto` via ctap2 (tipos de attestation).
rs256 = ["ctap2/rs256"]
# Propaga o modo host (`std`) das dependências internas; alvos bare-metal
# compilam com `--no-default-features` (`no_std` + `alloc`).
std = ["ctap2/std"]
