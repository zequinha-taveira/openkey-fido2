[package]
name = "transport"
version = "0.1.0"
edition = "2021"
description = "Transport layer for FIDO2 authenticator (USB-HID, CCID, NFC, BLE)"
license = "MIT"

[dependencies]
log = { version = "0.4", default-features = false }
thiserror = { version = "2.0", default-features = false }

[dependencies.embedded-hal]
version = "1.0"
optional = true

[dependencies.usb-device]
version = "0.3"
optional = true

[features]
default = ["std"]
std = ["thiserror/std"]
embedded = ["dep:embedded-hal"]
usb-device = ["dep:usb-device", "embedded"]

