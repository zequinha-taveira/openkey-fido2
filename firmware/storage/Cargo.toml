[package]
name = "storage"
version = "0.1.1"
edition = "2021"
description = "Persistent storage engine for FIDO2 authenticator credentials"
license = "MIT"

[dependencies]
crypto = { path = "../../protocol/crypto", default-features = false }
log = "0.4"
# Serialização compartilhada (credenciais e snapshot de flash): CBOR é
# compacto e no_std-safe; JSON fica restrito ao backend de arquivos em host.
# `default-features = false` mantém a crate em modo puro (`no_std`).
ciborium = { version = "0.2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0", default-features = false }
zeroize = { workspace = true }

[dependencies.serde_json]
version = "1.0"
optional = true

[features]
default = ["std"]
# Mantém o backend de arquivos (fs/serde_json) disponível em hosts; alvos
# bare-metal compilam com `--no-default-features` usando apenas os backends
# de memória e flash.
std = ["dep:serde_json"]
