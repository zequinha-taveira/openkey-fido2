[package]
name = "storage"
version = "0.1.0"
edition = "2021"
description = "Persistent storage engine for FIDO2 authenticator credentials"
license = "MIT"

[dependencies]
crypto = { path = "../../protocol/crypto" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hex = "0.4"
zeroize = { workspace = true }