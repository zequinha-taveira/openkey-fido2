[target.thumbv8m.main-none-eabihf]
# Target para RP2350 (ARM Cortex-M33)
# NOTA: o linker script `link.x` (do cortex-m-rt) é configurado no
# `.cargo/config.toml` local de cada binário bare-metal (ex.:
# examples/rp2350-firmware), não aqui — builds de lib (`-p transport`)
# não linkam e um `-Tlink.x` global duplicaria o flag em binários.
runner = "probe-rs run --chip RP2350"

[target.thumbv7em-none-eabihf]
# Target para nRF52840 (Cortex-M4F) e STM32L4 (Cortex-M4F)
runner = "probe-rs run --chip nRF52840_xxAA"

[alias]
# Atalhos de compilação cruzada para targets de hardware real.
# NOTA: `--no-default-features` é obrigatório — sem ele o feature `std` fica
# ativo e `thiserror/std` exige a stdlib, inexistente em targets bare-metal
# (erro `can't find crate for std`).
check-rp2350 = "check -p transport --target thumbv8m.main-none-eabihf --features embedded --no-default-features"
check-nrf52840 = "check -p transport --target thumbv7em-none-eabihf --features embedded --no-default-features"
check-stm32l4 = "check -p transport --target thumbv7em-none-eabihf --features embedded --no-default-features"
build-rp2350 = "build -p transport --target thumbv8m.main-none-eabihf --features embedded --no-default-features"
build-nrf52840 = "build -p transport --target thumbv7em-none-eabihf --features embedded --no-default-features"
build-stm32l4 = "build -p transport --target thumbv7em-none-eabihf --features embedded --no-default-features"

# Toolchain C do ring para checks cross (mesma config do crate standalone).
[env]
CC_thumbv8m_main_none_eabihf = "C:/Program Files/Raspberry Pi/Pico SDK v1.5.1/gcc-arm-none-eabi/bin/arm-none-eabi-gcc.exe"
AR_thumbv8m_main_none_eabihf = "C:/Program Files/Raspberry Pi/Pico SDK v1.5.1/gcc-arm-none-eabi/bin/arm-none-eabi-ar.exe"
CXX_thumbv8m_main_none_eabihf = "C:/Program Files/Raspberry Pi/Pico SDK v1.5.1/gcc-arm-none-eabi/bin/arm-none-eabi-g++.exe"
