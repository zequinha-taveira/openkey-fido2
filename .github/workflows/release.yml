name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pytest fido2 maturin

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Run E2E tests
        run: |
          cargo build -p fido2-simulator --locked
          python -m maturin build --manifest-path python/openkey_core/Cargo.toml --interpreter python --out dist
          python -m pip install --force-reinstall dist/*.whl
          python -m pytest tests/python -v

      - name: Build examples
        run: cargo build -p basic-example -p ccid-example --locked

  build-artifacts:
    name: Build Artifacts
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build fido2-simulator (release)
        run: cargo build -p fido2-simulator --release --locked

      - name: Build openkey-core wheel
        run: |
          python -m maturin build --manifest-path python/openkey_core/Cargo.toml --interpreter python --out dist

      - name: Stage release artifacts
        run: |
          mkdir -p artifacts
          cp target/release/fido2-simulator artifacts/
          cp dist/*.whl artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: artifacts/

  create-release:
    name: Create Release
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-artifacts
          path: artifacts

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

          draft: false
          prerelease: false
          files: |
            artifacts/fido2-simulator
            artifacts/*.whl
