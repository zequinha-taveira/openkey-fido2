name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      hardware_validated:
        description: 'Physical RP2350, nRF52840, and STM32L4 validation passed'
        required: true
        type: boolean
        default: false
      conformance_validated:
        description: 'Official FIDO Conformance Tool validation passed'
        required: true
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pytest fido2 maturin

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Run E2E tests
        run: |
          cargo build -p fido2-simulator --locked
          python -m maturin build --manifest-path python/openkey_core/Cargo.toml --interpreter python --out dist
          python -m pip install --force-reinstall dist/*.whl
          python -m pytest tests/python -v

      - name: Build examples
        run: cargo build -p basic-example -p ccid-example --locked

  build-artifacts:
    name: Build Artifacts
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build fido2-simulator (release)
        run: cargo build -p fido2-simulator --release --locked

      - name: Build openkey-core wheel
        run: |
          python -m maturin build --manifest-path python/openkey_core/Cargo.toml --interpreter python --out dist

      - name: Stage release artifacts
        run: |
          mkdir -p artifacts
          cp target/release/fido2-simulator artifacts/
          cp dist/*.whl artifacts/

      - name: Create artifact checksums
        working-directory: artifacts
        run: sha256sum fido2-simulator *.whl > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: artifacts/

  sign-artifacts:
    name: Sign Artifacts
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts
      - name: Require protected signing credentials
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$COSIGN_PRIVATE_KEY" || { echo 'COSIGN_PRIVATE_KEY is not configured'; exit 1; }
          test -n "$COSIGN_PASSWORD" || { echo 'COSIGN_PASSWORD is not configured'; exit 1; }
          test -n "$COSIGN_PUBLIC_KEY" || { echo 'COSIGN_PUBLIC_KEY is not configured'; exit 1; }
          for artifact in artifacts/fido2-simulator artifacts/*.whl artifacts/SHA256SUMS; do
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --output-signature "$artifact.sig" "$artifact"
            cosign verify-blob --key env://COSIGN_PUBLIC_KEY --signature "$artifact.sig" "$artifact"
          done
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-artifacts
          path: artifacts/

  create-release:
    name: Create Release
    needs: [build-artifacts, sign-artifacts]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.hardware_validated == true &&
      inputs.conformance_validated == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Download signed artifacts
        uses: actions/download-artifact@v8
        with:
          name: signed-release-artifacts
          path: artifacts

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

          draft: false
          prerelease: false
          files: |
            artifacts/fido2-simulator
            artifacts/*.whl
            artifacts/SHA256SUMS
            artifacts/*.sig
