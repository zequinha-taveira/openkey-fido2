name: Commit Message Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Commit Message
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest commit message
        id: get-message
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SHA="HEAD"
          fi
          # --no-merges: merge commits ("Merge pull request #N", "Merge ... into ...")
          # are auto-generated and don't follow the lowercase convention.
          # Message and ADR diff must be validated against the SAME commit;
          # otherwise a merge push diffs HEAD against its first parent and
          # flags docs/adr changes from the whole PR against the last
          # non-merge commit message.
          COMMIT_SHA=$(git log -1 --format=%H --no-merges "$SHA")
          MSG=$(git log -1 --format=%s --no-merges "$SHA")
          echo "message=$MSG" >> $GITHUB_OUTPUT
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Validate format
        run: |
          MSG="${{ steps.get-message.outputs.message }}"
          # Portuguese: lowercase start, imperative, concise
          if [[ ! $MSG =~ ^[a-z] ]]; then
            echo "❌ Commit message must start with lowercase letter (Portuguese convention)"
            exit 1
          fi
          if [ ${#MSG} -gt 72 ]; then
            echo "❌ Commit message must be max 72 characters"
            exit 1
          fi
          # Check for ADR reference when docs/adr changed
          COMMIT_SHA="${{ steps.get-message.outputs.sha }}"
          if git diff "${COMMIT_SHA}^" "$COMMIT_SHA" --name-only | grep -q '^docs/adr/'; then
            if [[ ! $MSG =~ adr: ]]; then
              echo "❌ ADR files changed but no 'adr: ADR-XXXX' reference"
              exit 1
            fi
          fi
          # Check for issue reference when message contains fix/bug
          if echo "$MSG" | grep -qiE '(fix|corrig|bug)'; then
            if ! echo "$MSG" | grep -qiE 'fixes #[0-9]+'; then
              echo "⚠️ Message mentions fix/bug but missing 'fixes #123'"
            fi
          fi
          echo "✅ Commit message validated"

      - name: Comment on PR if invalid
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const msg = '${{ steps.get-message.outputs.message }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Commit message validation failed**\n\`-${msg}\`\n\nPlease follow the commit message conventions:\n- Start with lowercase letter\n- Max 72 characters\n- Use imperative mood\n- Reference ADR: \`adr: ADR-XXXX\` when changing docs/adr\n- Reference issues: \`fixes #123\` when fixing`
            });
