name: "Nightly deploy"

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Deploy nightly (${{ matrix.refs }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        refs: [main, development]
    env:
      SIGNING_KEY_PATH: ${{ runner.temp }}/private.pem
    steps:
      - name: Check branch exists
        id: branch_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/branches/${{ matrix.refs }}" --silent >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Branch ${{ matrix.refs }} exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Branch ${{ matrix.refs }} does not exist — skipping."
          fi

      - name: Validate signing secret
        if: steps.branch_check.outputs.exists == 'true'
        env:
          PRIVATE_KEY_B64: ${{ secrets.PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_KEY_B64:-}" ]; then
            echo "::warning::PRIVATE_KEY_B64 is not configured — nightly will be unsigned (SHA256SUMS only)."
            echo "has_signing_key=false" >> "$GITHUB_ENV"
          else
            echo "$PRIVATE_KEY_B64" | base64 -d > /dev/null || { echo "::error::PRIVATE_KEY_B64 is not valid base64"; exit 1; }
            echo "has_signing_key=true" >> "$GITHUB_ENV"
            echo "Signing key present."
          fi

      - name: Checkout repository
        if: steps.branch_check.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.refs }}
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        if: steps.branch_check.outputs.exists == 'true'
        with:
          targets: thumbv8m.main-none-eabihf

      - uses: Swatinem/rust-cache@v2
        if: steps.branch_check.outputs.exists == 'true'
        with:
          workspaces: examples/rp2350-firmware
          key: nightly-${{ matrix.refs }}

      - uses: actions/setup-python@v5
        if: steps.branch_check.outputs.exists == 'true'
        with:
          python-version: '3.x'

      - name: Install Python deps
        if: steps.branch_check.outputs.exists == 'true'
        run: python -m pip install --upgrade pip maturin

      - name: Install GCC ARM (for ring C build)
        if: steps.branch_check.outputs.exists == 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Restore private key
        if: steps.branch_check.outputs.exists == 'true' && env.has_signing_key == 'true'
        env:
          PRIVATE_KEY_B64: ${{ secrets.PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          echo "$PRIVATE_KEY_B64" | base64 -d > "${SIGNING_KEY_PATH}"
          chmod 600 "${SIGNING_KEY_PATH}"
          test -s "${SIGNING_KEY_PATH}" || { echo "::error::Failed to restore signing key"; exit 1; }
          echo "Signing key restored to ${SIGNING_KEY_PATH} (600)."

      - name: Build workspace (release)
        if: steps.branch_check.outputs.exists == 'true'
        run: cargo build --workspace --release --locked

      - name: Build simulator (release)
        if: steps.branch_check.outputs.exists == 'true'
        run: cargo build -p fido2-simulator --release --locked

      - name: Build openkey_core wheel
        if: steps.branch_check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          python -m maturin build --manifest-path python/openkey_core/Cargo.toml --interpreter python --out dist --release
          ls -lh dist/

      - name: Build RP2350 firmware (release)
        if: steps.branch_check.outputs.exists == 'true'
        working-directory: examples/rp2350-firmware
        env:
          SECURE_BOOT_PKEY: ${{ env.SIGNING_KEY_PATH }}
        run: |
          set -euo pipefail
          cargo build --release --locked
          ls -lh target/thumbv8m.main-none-eabihf/release/rp2350-firmware || true
          arm-none-eabi-size target/thumbv8m.main-none-eabihf/release/rp2350-firmware || true

      - name: Build legacy Pico/ESP32 (if scripts exist)
        if: steps.branch_check.outputs.exists == 'true'
        env:
          PICO_SDK_PATH: ../pico-sdk
          SECURE_BOOT_PKEY: ${{ env.SIGNING_KEY_PATH }}
        run: |
          set -e
          if [ -f ./workflows/autobuild.sh ]; then
            echo "Running legacy autobuild for pico"
            ./workflows/autobuild.sh pico || echo "::warning::autobuild pico failed/skipped"
          else
            echo "workflows/autobuild.sh not found — skipping legacy pico build"
          fi
          if [ -f ./build_pico_fido.sh ]; then
            ./build_pico_fido.sh --no-eddsa || echo "::warning::build_pico_fido failed/skipped"
          else
            echo "build_pico_fido.sh not found — skipping"
          fi
          if [ -f ./workflows/autobuild.sh ]; then
            echo "Running legacy autobuild for esp32"
            ./workflows/autobuild.sh esp32 || echo "::warning::autobuild esp32 failed/skipped"
          fi

      - name: Stage release artifacts
        if: steps.branch_check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          mkdir -p release
          if [ -f target/release/fido2-simulator ]; then cp target/release/fido2-simulator release/; fi
          if [ -f target/debug/fido2-simulator ]; then cp target/debug/fido2-simulator release/fido2-simulator-debug || true; fi
          cp dist/*.whl release/ 2>/dev/null || true
          if [ -f examples/rp2350-firmware/target/thumbv8m.main-none-eabihf/release/rp2350-firmware ]; then
            cp examples/rp2350-firmware/target/thumbv8m.main-none-eabihf/release/rp2350-firmware release/
          fi
          # UF2 convert
          if [ -f release/rp2350-firmware ]; then
            if command -v picotool >/dev/null 2>&1; then
              picotool uf2 convert release/rp2350-firmware -t elf release/rp2350-firmware.uf2 -t uf2 || true
            else
              if ! command -v elf2uf2-rs >/dev/null 2>&1; then
                cargo install elf2uf2-rs --locked
              fi
              ~/.cargo/bin/elf2uf2-rs release/rp2350-firmware release/rp2350-firmware.uf2 || true
            fi
          fi
          (cd release && sha256sum * > SHA256SUMS || true)
          cat release/SHA256SUMS || true
          ls -lh release/

      - name: Sign artifacts (SHA256SUMS)
        if: steps.branch_check.outputs.exists == 'true' && env.has_signing_key == 'true'
        run: |
          set -euo pipefail
          if [ ! -f release/SHA256SUMS ]; then
            echo "::warning::No SHA256SUMS to sign"
            exit 0
          fi
          if command -v openssl >/dev/null 2>&1 && openssl pkey -in "${SIGNING_KEY_PATH}" -noout >/dev/null 2>&1; then
            openssl dgst -sha256 -sign "${SIGNING_KEY_PATH}" -out release/SHA256SUMS.sig release/SHA256SUMS
            openssl dgst -sha256 -verify <(openssl pkey -in "${SIGNING_KEY_PATH}" -pubout) -signature release/SHA256SUMS.sig release/SHA256SUMS && echo "Signature verified."
            ls -lh release/SHA256SUMS.sig
          else
            echo "::warning::openssl not available or key is not openssl-compatible — skipping detached signature"
          fi

      - name: Delete private key
        if: always() && steps.branch_check.outputs.exists == 'true'
        run: rm -f "${SIGNING_KEY_PATH}" || true

      - name: Update nightly release
        if: steps.branch_check.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ matrix.refs }}
          name: Nightly build (${{ matrix.refs }})
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release/*.*
          fail_on_unmatched_files: false
