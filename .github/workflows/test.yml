name: "Emulation and test"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '23 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pytest fido2 maturin

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Build simulator
        run: cargo build -p fido2-simulator --locked

      - name: Build openkey_core wheel
        run: |
          python -m maturin build --manifest-path python/openkey_core/Cargo.toml --interpreter python --out dist
          python -m pip install --force-reinstall dist/*.whl

      - name: Start emulation and test
        run: python -m pytest tests/python -v

      - name: Test persistence across restart
        run: python -m pytest tests/python/test_persistence.py tests/python/conformance/test_persistence_restart.py -v

      - name: Test firmware simulation
        run: python -m pytest tests/python/conformance/test_get_assertion.py tests/python/test_firmware_sim.py -v
