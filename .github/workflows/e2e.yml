name: E2E

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-e2e:
    name: Python E2E (simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pytest fido2 maturin

      - name: Build simulator
        run: cargo build -p fido2-simulator --locked

      - name: Build examples
        run: cargo build -p basic-example -p ccid-example --locked

      - name: Build and install openkey_core wheel
        run: |
          python -m maturin build --manifest-path python/openkey_core/Cargo.toml --interpreter python --out dist
          python -m pip install --force-reinstall dist/*.whl

      - name: Run pytest
        run: python -m pytest tests/python -v
