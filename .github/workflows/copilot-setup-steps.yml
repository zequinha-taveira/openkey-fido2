name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/rp2350-firmware

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pytest fido2 maturin

      - name: Install GCC ARM
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Validate workspace build
        run: cargo build --workspace --locked

      - name: Validate maturin build
        run: |
          python -m maturin build --manifest-path python/openkey_core/Cargo.toml --interpreter python --out dist || true
          ls -lh dist/ || true
