name: Dev Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-build:
    name: Dev Build (debug artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: python -m pip install --upgrade pip pytest fido2 maturin

      - name: Install GCC ARM (for ring C build)
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build workspace (debug)
        run: cargo build --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build simulator (debug)
        run: cargo build -p fido2-simulator --locked

      - name: Build examples
        run: cargo build -p basic-example -p ccid-example --locked

      - name: Build openkey_core wheel
        run: |
          python -m maturin build --manifest-path python/openkey_core/Cargo.toml --interpreter python --out dist
          ls -lh dist/

      - name: Build RP2350 firmware ELF (debug)
        working-directory: examples/rp2350-firmware
        run: cargo build --locked

      - name: RP2350 ELF info
        working-directory: examples/rp2350-firmware
        run: |
          ls -lh target/thumbv8m.main-none-eabihf/debug/rp2350-firmware
          file target/thumbv8m.main-none-eabihf/debug/rp2350-firmware || true
          arm-none-eabi-size target/thumbv8m.main-none-eabihf/debug/rp2350-firmware || true

      - name: UF2 convert (picotool or elf2uf2-rs)
        working-directory: examples/rp2350-firmware
        run: |
          set -e
          ELF=target/thumbv8m.main-none-eabihf/debug/rp2350-firmware
          UF2=target/thumbv8m.main-none-eabihf/debug/rp2350-firmware.uf2
          if command -v picotool >/dev/null 2>&1; then
            echo "picotool already installed: $(picotool version || picotool --version || echo ok)"
          elif sudo apt-get install -y picotool 2>/dev/null; then
            echo "picotool from apt"
          else
            echo "picotool not in apt, installing elf2uf2-rs"
            sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
            cargo install elf2uf2-rs --locked
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          if command -v picotool >/dev/null 2>&1; then
            picotool uf2 convert "$ELF" -t elf "$UF2" -t uf2
          else
            elf2uf2-rs "$ELF" "$UF2"
          fi
          ls -lh "$UF2"
          test -s "$UF2"

      - name: Diagnostics (fault catalog)
        run: |
          cargo build -p fido2-simulator --locked
          cd tests/python && python -m diagnostics.runner || true

      - name: Stage dev artifacts
        run: |
          mkdir -p dev-artifacts
          if [ -f target/debug/fido2-simulator ]; then cp target/debug/fido2-simulator dev-artifacts/; fi
          cp dist/*.whl dev-artifacts/ 2>/dev/null || true
          cp examples/rp2350-firmware/target/thumbv8m.main-none-eabihf/debug/rp2350-firmware dev-artifacts/rp2350-firmware.elf 2>/dev/null || true
          cp examples/rp2350-firmware/target/thumbv8m.main-none-eabihf/debug/rp2350-firmware.uf2 dev-artifacts/ 2>/dev/null || true
          (cd dev-artifacts && sha256sum * > SHA256SUMS || true)
          cat dev-artifacts/SHA256SUMS || true
          ls -lh dev-artifacts/

      - name: Upload dev build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dev-build-${{ github.sha }}
          path: |
            dev-artifacts/
            dist/*.whl
          retention-days: 7

      - name: Summary
        run: |
          echo "### Dev Build OK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Ref: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          cat dev-artifacts/SHA256SUMS >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
